name: "💡 Feature Proposal"
description: "Suggest an enhancement or new feature for the widget."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please note: This widget strictly adheres to a **Direct Client-to-Hub** architecture.
        Proposals requiring third-party intermediary servers, proxies, or non-Beszel backends cannot be accepted.
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: What would you like to see added or improved?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case / Rationale
      description: Why would this feature be useful for homelab monitoring?
    validations:
      required: true
