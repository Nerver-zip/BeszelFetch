name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Presets & Packages
        run: |
          mkdir -p dist
          python scripts/generate_preset.py
          cp widget/beszel_monitor.clip dist/beszel_monitor.clip
          cp widget/preset.json dist/beszel_monitor_preset.json
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/beszel_monitor.clip
            dist/beszel_monitor_preset.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
