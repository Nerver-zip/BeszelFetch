name: Gitleaks Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 0" # Weekly on Sunday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan Secrets with Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full commit history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${LATEST_TAG}/gitleaks_${LATEST_TAG#v}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks Security Scan
        run: |
          gitleaks detect --verbose --config=.gitleaks.toml
